# MySQL del laboratorio. Credenciales suministradas desde el entorno.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/PETCLINIC_DB?sslMode=REQUIRED&serverTimezone=UTC}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
  data:
    rest:
      basePath: /api
logging:
  file:
    name: target/application-mysql.log
server:
  port: 8080
